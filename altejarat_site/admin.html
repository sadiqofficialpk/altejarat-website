<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Al Tejarat</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/admin.css">
  <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <form class="login-card" id="loginForm">
    <img class="brand-logo lg" src="images/logo-mark.png" alt="Al Tejarat">
    <h2>Al Tejarat — Admin</h2>
    <p>Sirf admin ke liye. Password likhein:</p>
    <input type="password" id="passInput" placeholder="Admin password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="btn btn-green" type="submit">Login</button>
    <small class="hint">Default password: <b>admin123</b> — login ke baad Settings mein zaroor change karein.</small>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<!-- PANEL -->
<div class="panel" id="panel" hidden>
  <aside class="side">
    <div class="side-brand"><img class="brand-logo sm" src="images/logo-mark.png" alt="Al Tejarat"><span><strong>Al Tejarat</strong><small>Admin Panel</small></span></div>
    <nav>
      <button data-tab="dash" class="on">📊 Dashboard <span class="badge" id="badgeDash" hidden></span></button>
      <button data-tab="products">📦 Products</button>
      <button data-tab="categories">📁 Categories</button>
      <button data-tab="orders">🧾 Orders <span class="badge" id="badgeOrders" hidden></span></button>
      <button data-tab="reviews">⭐ Reviews</button>
      <button data-tab="profit">💰 Profit Report</button>
      <button data-tab="settings">⚙️ Settings</button>
    </nav>
    <div class="cloud-badge" id="cloudBadge">…</div>
    <button class="logout" id="logoutBtn">Logout</button>
  </aside>
  <main class="main" id="main"></main>
</div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/db.js"></script>
<script src="js/admin.js"></script>
<script>
// Safety check: agar js files load na hon to wazeh error dikhao
window.addEventListener('load', function() {
  if (typeof DB === 'undefined') {
    var el = document.getElementById('loginErr');
    if (el) el.textContent = 'Error: js/db.js load nahi hui — sari files (js folder समेत) poori upload karein.';
  }
});
</script>
</body>
</html>
